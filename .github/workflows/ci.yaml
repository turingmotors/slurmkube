name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet -tags integration ./...
      - name: unit (race)
        run: go test -race ./...
      - name: integration (envtest)
        run: make test-integration
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/chart/slurmkube
      - run: helm template slurmkube deploy/chart/slurmkube -f deploy/chart/slurmkube/values.yaml >/dev/null
      - run: make manifests
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Both platforms the release publishes, so the cross-compiling build is checked before a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
