apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slurmkube.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurmkube.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $cfg := deepCopy .Values.config }}
    {{- $_ := set $cfg "namespace" (include "slurmkube.namespace" .) }}
    {{- toYaml $cfg | nindent 4 }}
